      <stop offset="0" stop-color="#1b4a5a"/>
      <stop offset="1" stop-color="#2a7a6a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c867"/>
